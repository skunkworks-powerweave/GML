name: gml-lms

# GML LMS — three long-running services plus a one-shot schema gate.
#
# ── WHAT HAPPENED TO THE OTHER FIVE ──────────────────────────────────────────
#
# This file used to declare nine services. `postgres`, `redis`, `minio`,
# `minio-init` and `tusd` are gone, and none of them were removed for tidiness:
#
#   minio / minio-init  MinIO WITHDREW their public Docker images. Not the
#                       pinned tag -- the entire `minio/*` namespace returns
#                       "pull access denied ... repository does not exist".
#                       Because `app` and `worker` both declared
#                       `depends_on: minio: service_healthy`, NOTHING in this
#                       stack could start, on any machine, regardless of every
#                       other defect. See docs/verification.md (B9).
#
#   tusd                Wrote to bucket `gml-media`, which `minio-init` never
#                       created; had no healthcheck and nothing depended on it,
#                       so the failure was silent. Its proxy route returned 501
#                       on every branch because TUSD_INTERNAL_URL was set
#                       nowhere. Uploads go browser-direct to Supabase Storage.
#
#   redis               One service, one volume and one healthcheck for a queue
#                       carrying under 100 jobs/day. Replaced by a `jobs` table
#                       claimed with FOR UPDATE SKIP LOCKED.
#
#   postgres            Supabase IS the database. Keeping a local Postgres here
#                       while DATABASE_URL pointed at Supabase meant compose and
#                       .env disagreed about where the data lived, and the app
#                       container silently dialled the wrong one.
#
# ── WHAT RUNS ON THE BOX ─────────────────────────────────────────────────────
#
#   caddy     TLS termination and reverse proxy (the only published ports)
#   app       Next.js — HTML, RSC and API
#   worker    ffmpeg transcoding, queue consumer, periodic sweeps
#   migrate   one-shot; `app` and `worker` block on it exiting 0
#
# Video bytes never transit this host in either direction: uploads go browser →
# Supabase Storage, and playback segments are fetched by the browser from
# Supabase's CDN via signed URLs embedded in the playlist. EC2 serves HTML, RSC
# and API only, which is what makes a 2-vCPU instance sufficient.

# ── Logging ───────────────────────────────────────────────────────────────────
# Docker's default json-file driver has NO SIZE LIMIT. On a long-running single
# EC2 box that is a slow disk-fill: the worker logs an ffmpeg line per job and
# Caddy an access line per request, forever, until / is full -- at which point
# Postgres connections, the next backup and the next deploy all fail at once,
# for a reason that looks nothing like "log files". 3x10MB per service is 120MB
# worst case across the stack.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrate:
    # One-shot schema gate. Applies drizzle migrations + _post/*.sql, then exits.
    # `app` and `worker` block on it completing successfully, so the stack can
    # never come up against an unmigrated database -- which is exactly what
    # used to happen (health reported 0-of-22 migrations applied and every
    # authenticated page threw). See docs/verification.md (B13).
    #
    # Safe on every `up`: both ledgers make it a no-op once current. If it exits
    # non-zero, `app` never starts and the PREVIOUS container keeps serving.
    # That is the rollback posture, and it is deliberate.
    # EXPLICIT IMAGE NAME, so the deploy/rollback tags mean something.
    #
    # Without an `image:` key Compose derives one from the project name --
    # gml-lms-migrate:latest -- and runs THAT regardless of what else is tagged.
    # So deploy.sh tagged gml-lms-migrate:current / :previous and Compose ignored
    # both, and rollback.sh's "retag previous -> current, then up" changed
    # nothing: it restarted the very image it was rolling back from. Neither tag
    # had ever been created either, so in practice rollback.sh aborted first
    # with "gml-lms-app:previous does not exist".
    #
    # Naming the tag here makes `docker compose build` write into :current and
    # `docker compose up` run :current, which is what gives those two scripts
    # something real to move.
    image: gml-lms-migrate:current
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    restart: "no"
    logging: *default-logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set — Supabase session-pooler URI}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL must be set}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY must be set}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY must be set}
      # SEED-TIME CREDENTIALS. deploy.sh runs the seed with
      #   docker compose run --rm --no-deps migrate ... seed_all.ts
      # and `compose run` passes ONLY what this block declares -- it does not
      # leak the host environment or .env into the container. Without these,
      # seed.ts took the `SUPER_ADMIN_EMAIL not set` branch, logged "skipped",
      # and exited 0. A fresh deploy therefore reported SUCCESS and produced a
      # system WITH NO ADMINISTRATOR -- and no way to create one, because
      # /admin/users requires an administrator to reach it.
      #
      # Unset rather than `:?` because they are only needed on a first deploy;
      # re-running the seed against an existing super admin is a no-op and must
      # not require the password to still be lying around in .env.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_INITIAL_PASSWORD: ${SUPER_ADMIN_INITIAL_PASSWORD:-}
      # Optional: choose the section-gate passwords instead of having the seed
      # generate and print them once.
      GATE_PASSWORD_OBSERVATION: ${GATE_PASSWORD_OBSERVATION:-}
      GATE_PASSWORD_MENTORSHIP: ${GATE_PASSWORD_MENTORSHIP:-}
      GATE_PASSWORD_ADMIN: ${GATE_PASSWORD_ADMIN:-}
      SEED_DRY_RUN: ${SEED_DRY_RUN:-}
    networks:
      - lms_net

  app:
    # Next.js web + API + Server Actions.
    # EXPLICIT IMAGE NAME, so the deploy/rollback tags mean something.
    #
    # Without an `image:` key Compose derives one from the project name --
    # gml-lms-app:latest -- and runs THAT regardless of what else is tagged.
    # So deploy.sh tagged gml-lms-app:current / :previous and Compose ignored
    # both, and rollback.sh's "retag previous -> current, then up" changed
    # nothing: it restarted the very image it was rolling back from. Neither tag
    # had ever been created either, so in practice rollback.sh aborted first
    # with "gml-lms-app:previous does not exist".
    #
    # Naming the tag here makes `docker compose build` write into :current and
    # `docker compose up` run :current, which is what gives those two scripts
    # something real to move.
    image: gml-lms-app:current
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-https://${DOMAIN:-localhost}}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL must be set}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY must be set}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY must be set}
      # Outbound email is configured in the Supabase dashboard, not here. Set
      # this to `true` only after an SMTP provider is attached there; until then
      # the UI says plainly that password resets go through an administrator.
      AUTH_EMAIL_ENABLED: ${AUTH_EMAIL_ENABLED:-false}
      # Refused rather than defaulted: an unset app secret used to make the
      # WhatsApp webhook accept unsigned POSTs from anyone on the internet.
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:?WHATSAPP_APP_SECRET must be set — the webhook refuses all traffic without it}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      GML_WHATSAPP_NUMBER: ${GML_WHATSAPP_NUMBER:-}
      GML_HELPDESK_PHONE: ${GML_HELPDESK_PHONE:-}
      GML_HELPDESK_EMAIL: ${GML_HELPDESK_EMAIL:-}
      # Off by default. /api/health's `details` carry raw driver messages --
      # internal hostnames, ports, auth-failure text -- and the endpoint is
      # public. Documented in .env.example; passed here so it can actually be
      # turned on during an incident without editing this file.
      HEALTH_DEBUG: ${HEALTH_DEBUG:-}
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - lms_net
    healthcheck:
      # node:22-slim has neither wget nor curl, so the previous check could
      # never pass and the container sat `unhealthy` forever
      # (docs/verification.md B14). `node` is the only usable binary.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    # ffmpeg transcoding, queue consumer, periodic sweeps.
    # EXPLICIT IMAGE NAME, so the deploy/rollback tags mean something.
    #
    # Without an `image:` key Compose derives one from the project name --
    # gml-lms-worker:latest -- and runs THAT regardless of what else is tagged.
    # So deploy.sh tagged gml-lms-worker:current / :previous and Compose ignored
    # both, and rollback.sh's "retag previous -> current, then up" changed
    # nothing: it restarted the very image it was rolling back from. Neither tag
    # had ever been created either, so in practice rollback.sh aborted first
    # with "gml-lms-app:previous does not exist".
    #
    # Naming the tag here makes `docker compose build` write into :current and
    # `docker compose up` run :current, which is what gives those two scripts
    # something real to move.
    image: gml-lms-worker:current
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL must be set}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY must be set}
      # ONE, not two. A single ffmpeg at -preset veryfast saturates both vCPUs
      # of the target instance; a second starves the web tier it shares the box
      # with. Queue depth absorbs bursts -- that is what a queue is for.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - lms_net
    healthcheck:
      # The worker has no HTTP surface, so this asks the question that actually
      # matters: can it still reach the queue? A worker that is running but
      # cannot claim looks identical to an idle one, and previously the
      # container had no healthcheck at all -- a crash-loop was invisible.
      test:
        - CMD
        - node
        - -e
        - "const{Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL,connectionTimeoutMillis:4000});c.connect().then(()=>c.query('select 1 from jobs limit 1')).then(()=>c.end()).then(()=>process.exit(0)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      # ffmpeg scratch. On DISK, not tmpfs: the previous `tmpfs: /tmp size=2g`
      # both failed on a source larger than ~1 GB (which has to coexist with its
      # own HLS output) and spent 2 GiB of RAM on a box with 8.
      - worker_scratch:/tmp

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set for Let's Encrypt}
      # The CSP has to name the exact Supabase project origin: the browser
      # uploads to Storage and fetches HLS segments from it directly. Falls back
      # to a wildcard over supabase.co, which works but is looser than it needs
      # to be -- set this to your project origin in .env.
      SUPABASE_ORIGIN: ${NEXT_PUBLIC_SUPABASE_URL:-https://*.supabase.co}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    networks:
      - lms_net
    healthcheck:
      # Probes the dedicated :2021 health listener in the Caddyfile. The old
      # check hit http://127.0.0.1:80, whose Host header matches no site block,
      # so Caddy answered 404 and this container reported unhealthy forever
      # while proxying correctly.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2021/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  worker_scratch:
  caddy_data:
  caddy_config:

networks:
  lms_net:
    driver: bridge
