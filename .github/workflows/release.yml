# Release: a version tag (v1.2.3, or v1.2.3-rc.1 for a release candidate)
# re-runs the whole CI gate, then publishes the three images to GitHub's
# container registry under that version:
#
#   ghcr.io/<owner>/gml-app:1.2.3
#   ghcr.io/<owner>/gml-worker:1.2.3
#   ghcr.io/<owner>/gml-migrate:1.2.3
#
# These are the release's artifacts of record: what QA tested, and what a
# security scan or a later pull-based deploy reads. scripts/deploy.sh still
# builds on the server from the same tag (README-deploy.md section 4), so a
# deploy does not depend on the registry being reachable.
#
# Cutting a release (see docs/handover/IT-HANDOVER.md):
#   git tag -a v1.2.3-rc.1 -m "..." && git push origin v1.2.3-rc.1
# then publish a GitHub Release for the tag; publishing it deploys to staging
# (deploy.yml).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/test.yml

  images:
    name: publish ${{ matrix.image }} image
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [app, worker, migrate]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3-rc.1 is tagged as itself only; a final 1.2.3 is also "latest".
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/gml-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
