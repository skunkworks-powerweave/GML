# CI gate for GML LMS.
#
# History worth knowing: this workflow triggered on `push: branches: [main]`
# while the repository's branch was `master`, and the repo had no git remote at
# all -- so it had never executed once. It also ran `pnpm -r typecheck` at a
# time when only packages/db defined a `typecheck` script, meaning the
# application itself was never type-checked, and it never ran lint.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# None of the three jobs declares a `name:`, deliberately.
#
# GitHub shows a job's `name:` when it has one and the job id otherwise, and
# branch protection matches required status checks against that displayed
# string LITERALLY. These jobs were named `lint · typecheck · build ·
# governance`, `behavioural tests (real Postgres)` and `container images`: a
# U+00B7 and a pair of parentheses that have to be reproduced exactly into the
# required-checks box. A rule that does not match any check name does not fail
# — it silently requires nothing, which is the same failure mode as the hooks
# this branch is replacing. Dropping `name:` makes the check names the job ids
# (`static`, `behaviour`, `images`): plain, typeable, stable ASCII.
jobs:
  static:
    runs-on: ubuntu-latest
    env:
      # packages/db/src/client.ts builds a pg Pool at import time and now THROWS
      # on a missing DATABASE_URL rather than silently inventing one, so the
      # build needs a URL it will never dial.
      DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4        # version comes from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Covers apps/web, apps/worker, packages/db and packages/shared. Before
      # the scripts were added this silently checked one package out of five,
      # which is how a BullMQ 5 type error sat in the worker undetected.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm build

      # The executable bit is part of a shell script's contract and is the one
      # part of it that never shows up in a diff. scripts/*.sh are the deploy,
      # backup, restore and rollback path: a 100644 there turns
      # `./scripts/restore.sh` into "Permission denied" on the single day
      # anyone runs it, and Windows checkouts drop the bit silently.
      - name: Shell scripts are executable
        run: |
          bad=$(git ls-files -s scripts/*.sh | awk '$1!="100755"')
          if [ -n "$bad" ]; then
            echo "::error::scripts/*.sh must be committed mode 100755; these are not:"
            echo "$bad"
            echo "fix with: git update-index --chmod=+x <path>"
            exit 1
          fi

      # Run the enforcement suite on its own, BEFORE `pnpm test`.
      #
      # `pnpm test` shells through scripts/test-gate.mjs, which is itself part
      # of the enforcement layer -- it writes the receipt the commit hook
      # trusts. If that wrapper breaks, every suite underneath it goes dark and
      # reports nothing, which is precisely how six dead hooks survived 27
      # commits. This step verifies the gates by a path that does not depend on
      # the gates.
      - name: Hook enforcement tests
        run: pnpm test:hooks

      - name: Governance + script tests
        run: pnpm test

  behaviour:
    runs-on: ubuntu-latest
    # A REAL DATABASE. The governance suite reads source files and regex-matches
    # their text; not one of its assertions can observe a runtime behaviour. This
    # job is where things are actually executed.
    #
    # This is only possible because the _post/*.sql migrations were made portable
    # -- they previously referenced Supabase's `anon`, `authenticated`,
    # `supabase_auth_admin` roles and the `auth` schema unguarded, so the FIRST
    # _post file aborted the run against a plain Postgres and no schema was
    # created at all.
    #
    # The image was raised from 16.4 to 17. What that is NOT is "matching
    # production", which an earlier version of this comment claimed: nothing in
    # this repository records the major version Supabase runs. docker-compose.yml
    # declares migrate, app, worker and caddy and no postgres at all -- its own
    # comment says Supabase IS the database.
    #
    # NINE places in this tree record a Postgres version, and not one of them is
    # a reading of production: this CI service; the
    # 16.4-alpine probe in docs/verification.md and the same probe cited in
    # docs/substrate-moats.md; postgresql-client-16 in scripts/backup.sh, in
    # scripts/preflight.sh (twice) and in README-deploy.md; and 16.4 / 16-alpine
    # in two specs/*/research.md files.
    #
    # The count is of RECORDS, not of grep hits: the command above returns 17
    # lines across 10 files, the extra eight being this comment's own line, three
    # in CLAUDE.md and four in tests/hooks/settings-wiring.test.mjs, none of which
    # records a version of anything. An earlier version of this comment quoted
    # that command and said it "finds nine places", which is the kind of number
    # attached to the wrong evidence that this file complains about elsewhere; and
    # the version before THAT listed three of the nine and said "only", while the
    # CLAUDE.md passage making the same point was complete.
    #
    # The client pin is the sharpest evidence AGAINST 17, not for it: pg_dump 16
    # refuses to dump a 17 server, so a production already on 17 would mean the
    # nightly backups have never produced a file. Which major Supabase actually
    # runs is an open question. Whoever reads it off the Supabase project records
    # it in docs/verification.md and pins the backup client to match. There is no
    # numbered remediation item for this: an earlier version of this comment
    # cited "P4-07 of the remediation plan", and no such item exists in any file
    # in this repository.
    #
    # 17 is chosen here as the newer of the two and the likelier target, and
    # the honest statement is that CI now exercises 17 while the deployment's
    # version is unrecorded.
    #
    # NOTE: `services:` / `postgres:` / `image:` must stay on three adjacent
    # lines. tests/governance/test_165 matches them with a single regex, so a
    # comment inserted between them fails that gate for no real reason.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gml
          POSTGRES_PASSWORD: gml
          POSTGRES_DB: gml_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gml -d gml_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gml:gml@127.0.0.1:5432/gml_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Proves the migration set applies from EMPTY. A schema that only works by
      # accumulating patches on an existing database is not a schema you can
      # deploy, and this repo shipped one for months: migration 0000 declared
      # users_email_unique as both a CONSTRAINT and an INDEX, so a fresh database
      # aborted with `42P07 relation already exists`. Nobody noticed because
      # nobody had ever created the schema from scratch.
      - name: Apply migrations from empty
        run: pnpm --filter @gml/db exec tsx scripts/migrate.ts

      - name: Behavioural tests
        run: pnpm test:behaviour

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Building the images in CI catches the class of defect that produced a
      # worker container with no source code in it: a Dockerfile can only be
      # verified by building it. Load, don't push -- no registry credentials are
      # needed for a correctness gate.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: false
          load: true
          tags: gml-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/migrate.Dockerfile
          push: false
          load: true
          tags: gml-migrate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Actually START the worker and require it to reach its own startup log.
      #
      # A file-existence check is too weak, and the first version of this step
      # proved it twice over: it hardcoded /app while the image builds at /repo
      # (so it failed on a correct image), and it could not have caught three of
      # the four defects that made this container unrunnable -- no source in the
      # image at all; corepack missing from the runner stage; `pnpm exec`
      # re-entering corepack and dying with EACCES as the unprivileged user; and
      # `dotenv` imported but never declared, which resolved via monorepo
      # hoisting and failed in a clean image.
      #
      # Reaching the `online {...concurrency...}` line proves every import
      # resolved and the module body executed. It then fails to reach the
      # throwaway database below, which is expected and ignored -- connectivity
      # is not what this gate is for.
      - name: Worker image starts and resolves its entrypoint
        run: |
          set -o pipefail
          out=$(timeout 60 docker run --rm \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://u:p@127.0.0.1:5432/db \
            -e NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_SECRET_KEY=ci-placeholder \
            gml-worker:ci 2>&1 | head -40 || true)
          echo "$out"
          echo "$out" | grep -q 'concurrency' || {
            echo "::error::worker image never reached its startup log — it cannot run"
            exit 1
          }

      # ffmpeg is the entire purpose of this image; a worker that starts but
      # cannot transcode is no more useful than one that crash-loops.
      - name: Worker image has ffmpeg and ffprobe
        run: |
          docker run --rm --entrypoint sh gml-worker:ci -c 'ffmpeg -version && ffprobe -version' >/dev/null \
          || { echo "::error::ffmpeg/ffprobe missing from worker image"; exit 1; }

      # The compose file must remain parseable and must not reacquire the
      # services that were removed. A stray `redis:` block would come back as a
      # container nothing talks to.
      - name: Compose file is valid and minimal
        run: |
          set -e
          export DOMAIN=example.org ACME_EMAIL=ci@example.org \
                 DATABASE_URL=postgres://u:p@h:5432/d \
                 NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
                 NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci \
                 SUPABASE_SECRET_KEY=ci WHATSAPP_APP_SECRET=ci
          docker compose config >/tmp/compose.yml
          for gone in redis minio tusd postgres; do
            if grep -qE "^  ${gone}:" /tmp/compose.yml; then
              echo "::error::service '${gone}' is back in docker-compose.yml"
              exit 1
            fi
          done
