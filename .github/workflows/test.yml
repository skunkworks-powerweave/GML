# CI gate for GML LMS.
#
# History worth knowing: this workflow triggered on `push: branches: [main]`
# while the repository's branch was `master`, and the repo had no git remote at
# all -- so it had never executed once. It also ran `pnpm -r typecheck` at a
# time when only packages/db defined a `typecheck` script, meaning the
# application itself was never type-checked, and it never ran lint.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: lint · typecheck · build · governance
    runs-on: ubuntu-latest
    env:
      # packages/db/src/client.ts builds a pg Pool at import time and now THROWS
      # on a missing DATABASE_URL rather than silently inventing one, so the
      # build needs a URL it will never dial.
      DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v4

      # The runbook's first command is `./scripts/deploy.sh`, and the cron lines
      # run backup.sh and restore.sh the same way. Every script was once
      # committed 100644, so each of those was "Permission denied" on a fresh
      # clone. A regex over file text cannot see a mode bit; this checks the
      # checked-out files the way an operator's shell would.
      - name: Operator shell scripts are executable
        run: |
          for f in scripts/*.sh; do
            test -x "$f" || { echo "::error::$f is not executable -- git update-index --chmod=+x $f"; exit 1; }
          done

      - uses: pnpm/action-setup@v4        # version comes from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Covers apps/web, apps/worker, packages/db and packages/shared. Before
      # the scripts were added this silently checked one package out of five,
      # which is how a BullMQ 5 type error sat in the worker undetected.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm build

      - name: Governance + script tests
        run: pnpm test

  behaviour:
    name: behavioural tests (real Postgres)
    runs-on: ubuntu-latest
    # A REAL DATABASE. The governance suite reads source files and regex-matches
    # their text; not one of its assertions can observe a runtime behaviour. This
    # job is where things are actually executed.
    #
    # This is only possible because the _post/*.sql migrations were made portable
    # -- they previously referenced Supabase's `anon`, `authenticated`,
    # `supabase_auth_admin` roles and the `auth` schema unguarded, so the FIRST
    # _post file aborted the run against a plain Postgres and no schema was
    # created at all.
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: gml
          POSTGRES_PASSWORD: gml
          POSTGRES_DB: gml_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gml -d gml_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gml:gml@127.0.0.1:5432/gml_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Proves the migration set applies from EMPTY. A schema that only works by
      # accumulating patches on an existing database is not a schema you can
      # deploy, and this repo shipped one for months: migration 0000 declared
      # users_email_unique as both a CONSTRAINT and an INDEX, so a fresh database
      # aborted with `42P07 relation already exists`. Nobody noticed because
      # nobody had ever created the schema from scratch.
      - name: Apply migrations from empty
        run: pnpm --filter @gml/db exec tsx scripts/migrate.ts

      - name: Behavioural tests
        run: pnpm test:behaviour

  images:
    name: container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Building the images in CI catches the class of defect that produced a
      # worker container with no source code in it: a Dockerfile can only be
      # verified by building it. Load, don't push -- no registry credentials are
      # needed for a correctness gate.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: false
          load: true
          tags: gml-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/migrate.Dockerfile
          push: false
          load: true
          tags: gml-migrate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Actually START the worker and require it to reach its own startup log.
      #
      # A file-existence check is too weak, and the first version of this step
      # proved it twice over: it hardcoded /app while the image builds at /repo
      # (so it failed on a correct image), and it could not have caught three of
      # the four defects that made this container unrunnable -- no source in the
      # image at all; corepack missing from the runner stage; `pnpm exec`
      # re-entering corepack and dying with EACCES as the unprivileged user; and
      # `dotenv` imported but never declared, which resolved via monorepo
      # hoisting and failed in a clean image.
      #
      # Reaching the `online {...concurrency...}` line proves every import
      # resolved and the module body executed. It then fails to reach the
      # throwaway database below, which is expected and ignored -- connectivity
      # is not what this gate is for.
      - name: Worker image starts and resolves its entrypoint
        run: |
          set -o pipefail
          out=$(timeout 60 docker run --rm \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://u:p@127.0.0.1:5432/db \
            -e NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_SECRET_KEY=ci-placeholder \
            gml-worker:ci 2>&1 | head -40 || true)
          echo "$out"
          echo "$out" | grep -q 'concurrency' || {
            echo "::error::worker image never reached its startup log — it cannot run"
            exit 1
          }

      # ffmpeg is the entire purpose of this image; a worker that starts but
      # cannot transcode is no more useful than one that crash-loops.
      - name: Worker image has ffmpeg and ffprobe
        run: |
          docker run --rm --entrypoint sh gml-worker:ci -c 'ffmpeg -version && ffprobe -version' >/dev/null \
          || { echo "::error::ffmpeg/ffprobe missing from worker image"; exit 1; }

      # The compose file must remain parseable and must not reacquire the
      # services that were removed. A stray `redis:` block would come back as a
      # container nothing talks to.
      - name: Compose file is valid and minimal
        run: |
          set -e
          export DOMAIN=example.org ACME_EMAIL=ci@example.org \
                 DATABASE_URL=postgres://u:p@h:5432/d \
                 NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
                 NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci \
                 SUPABASE_SECRET_KEY=ci WHATSAPP_APP_SECRET=ci
          docker compose config >/tmp/compose.yml
          for gone in redis minio tusd postgres; do
            if grep -qE "^  ${gone}:" /tmp/compose.yml; then
              echo "::error::service '${gone}' is back in docker-compose.yml"
              exit 1
            fi
          done
