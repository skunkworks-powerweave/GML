# CI gate for GML LMS.
#
# History worth knowing: this workflow previously triggered on `push: branches:
# [main]` while the repository's branch is `master`, and the repo has no git
# remote at all -- so it had never executed even once. It also ran
# `pnpm -r typecheck` at a time when only `packages/db` defined a `typecheck`
# script, meaning the application itself was never type-checked, and it never
# ran lint. Both are fixed below.
name: ci

on:
  push:
    # `master` is the current branch; `main` is here so a rename does not
    # silently disable CI again. Remove whichever one you do not keep.
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: lint · typecheck · build · governance
    runs-on: ubuntu-latest
    env:
      # packages/db/src/client.ts builds a pg Pool at import time. Give it a URL
      # it will never dial so `next build` cannot fail on a missing env var.
      DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4        # version comes from packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint was absent from CI entirely. It now covers apps/web, apps/worker
      # and packages/db (eslint was configured in the latter two but never
      # installed, so `pnpm lint` failed on a missing binary).
      - name: Lint
        run: pnpm lint

      # Covers apps/web, apps/worker, packages/db and packages/shared. Before
      # the scripts were added this silently checked one package out of five,
      # which is how a BullMQ 5 type error sat in the worker undetected.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm build

      - name: Governance tests
        run: pnpm test

      # Runs without `|| true`. The mask was unnecessary -- the smoke suite
      # already test.skip()s itself when the app is unreachable, and
      # `node --test` exits 0 when everything skips. All `|| true` added was the
      # ability to swallow a genuine failure once the suite becomes real.
      - name: Integration smoke (skips when no stack is reachable)
        run: pnpm test:smoke

  images:
    name: container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Building the images in CI is what catches the class of defect that
      # produced a worker container with no source code in it: a Dockerfile can
      # only be verified by building it. Load, don't push -- no registry
      # credentials are needed for a correctness gate.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: false
          load: true
          tags: gml-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Actually START the worker and require it to reach its own startup log.
      #
      # A file-existence check is too weak, and the first version of this step
      # proved it twice over: it hardcoded /app while the image builds at /repo
      # (so it failed on a correct image), and it could not have caught three of
      # the four defects that made this container unrunnable. Those were:
      # no source in the image at all; corepack missing from the runner stage;
      # `pnpm exec` re-entering corepack and dying with EACCES as the
      # unprivileged worker user; and `dotenv` imported but never declared,
      # which resolved via monorepo hoisting and failed in a clean image.
      #
      # Reaching the `online {...concurrency...}` line proves every import
      # resolved and the module body executed. The container then fails to
      # connect to the throwaway Redis/Postgres addresses below, which is
      # expected and ignored -- connectivity is not what this gate is for.
      - name: Worker image starts and resolves its entrypoint
        run: |
          set -o pipefail
          out=$(timeout 60 docker run --rm \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://u:p@127.0.0.1:5432/db \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            gml-worker:ci 2>&1 | head -40 || true)
          echo "$out"
          echo "$out" | grep -q 'concurrency' || {
            echo "::error::worker image never reached its startup log — it cannot run"
            exit 1
          }

      # ffmpeg is the entire purpose of this image; a worker that starts but
      # cannot transcode is no more useful than one that crash-loops.
      - name: Worker image has ffmpeg
        run: |
          docker run --rm --entrypoint sh gml-worker:ci -c 'ffmpeg -version' >/dev/null \
          || { echo "::error::ffmpeg missing from worker image"; exit 1; }
